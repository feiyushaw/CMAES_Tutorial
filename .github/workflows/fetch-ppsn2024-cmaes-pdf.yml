name: Fetch PPSN 2024 CMA-ES PDF

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fetch-ppsn2024-cmaes-pdf.yml'
      - 'docs/papers/ppsn2024_cmaes_tutorial_zh.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-pdf:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ppsn2024-cmaes-tutorial
          fetch-depth: 0

      - name: Download author-public PPSN 2024 slides
        run: |
          mkdir -p docs/papers
          curl -L --fail --retry 3 \
            'https://www.cmap.polytechnique.fr/~nikolaus.hansen/CMATutorialPPSN2024.pdf' \
            -o docs/papers/CMATutorialPPSN2024.pdf
          test -s docs/papers/CMATutorialPPSN2024.pdf
          file docs/papers/CMATutorialPPSN2024.pdf | grep -q PDF

      - name: Commit PDF to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/papers/CMATutorialPPSN2024.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add PPSN 2024 CMA-ES tutorial PDF'
            git push origin HEAD:docs/ppsn2024-cmaes-tutorial
          fi
